<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>My Movie Database - Search</title>
		<link rel="stylesheet" href="./styles/style.css" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
		/>
		<script
			src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.7/purify.min.js"
			defer
		></script>
		<script
			src="https://kit.fontawesome.com/f300007e95.js"
			crossorigin="anonymous"
		></script>
		<script type="module" src="./scripts/script.js"></script>
	</head>
	<body>
		<header class="header">
			<div class="content-wrapper header__flex" id="header">
				<a href="index.html"
					><img
						class="header__logo"
						src="./res/logo.png"
						alt="logotype" /><img
						src="./res/Logo-small.png"
						alt="logotype"
						class="header__logo-small"
				/></a>
				<form class="header__form" id="searchForm">
					<input
						class="header__input"
						id="searchInput"
						type="text"
						aria-label="Search"
						autocomplete="off"
					/>
					<button class="header__form-btn" id="searchBtn">
						Search
					</button>
					<ul
						class="header__search-popup d-none"
						id="searchPopup"
					></ul>
				</form>
				<div class="header__fav-group">
					<a
						href="./favorites.html"
						class="header__fav-btn"
						id="favBtn"
						>Favorites</a
					>
					<section
						class="header__fav-popup d-none"
						id="favPopup"
					></section>
				</div>
			</div>
		</header>

		<!-- Search movies section -->
		<main class="search-results">
			<div class="content-wrapper">
				<h2 class="search-results__title">Search Results</h2>
				<ul class="search-results__section" id="searchList">
					<!-- <li class="search-results__item">
						<article class="search-card">
							<img src="" alt="" class="search-card__poster" />
							<div class="search-card__info-group">
								<h3 class="search-card__title"></h3>
								<span class="search-card__year"></span>
								<span class="search-card__type"></span>
							</div>
						</article>
					</li> -->
				</ul>
			</div>
		</main>
	</body>
</html>
